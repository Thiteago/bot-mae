services:
  bot:
    build: .
    command: bin/bot
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SEER_WEBHOOK_PORT:-8090}:${SEER_WEBHOOK_PORT:-8090}"
    networks:
      default: {}
      seerr_default:
        aliases:
          - bot-mae-webhook

networks:
  default:
  seerr_default:
    external: true
