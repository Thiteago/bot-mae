services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  bot:
    build: .
    command: bin/bot
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - redis

  worker:
    build: .
    command: bin/worker
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - redis

volumes:
  redis-data:
